\* Task-based specification; run conflux/run-tlc.sh.
\* Two replicas and values, with two slots per loglet; this is a large model.
\* run-tlc.sh enables the optional Java override. --quick uses ConfluxQuick.cfg
\* (one slot per loglet); --check validates reconstruction on a smaller model.
\* For simulation, use -simulate num=10000 -depth 300. See Conflux_notes.md.
CONSTANTS
    Replicas = {r1, r2}
    Values = {A, B}
    MaxLogletLength = 2
    MaxLoglets = 2
    FailuresEnabled = TRUE

    IDLE = IDLE
    READY = READY
    REFRESH_MANIFEST = REFRESH_MANIFEST
    REFRESH_AFTER_MISSING = REFRESH_AFTER_MISSING
    LOAD_SNAPSHOT = LOAD_SNAPSHOT
    CHECKTAIL = CHECKTAIL
    RECEIVE_TAIL = RECEIVE_TAIL
    CHECK_SEAL = CHECK_SEAL
    READ_NEXT = READ_NEXT
    AWAIT_RECONFIG = AWAIT_RECONFIG
    ACQUIRE_SLOT = ACQUIRE_SLOT
    WRITE = WRITE
    COMPLETE_SLOT = COMPLETE_SLOT
    SEAL = SEAL
    SLOW_CHECKTAIL = SLOW_CHECKTAIL
    COMMIT_RECONFIG = COMMIT_RECONFIG
    COMMIT_TRIM = COMMIT_TRIM
    ENTRY_NOT_FOUND = ENTRY_NOT_FOUND
    FREE = FREE
    ACQUIRED = ACQUIRED
    COMPLETED = COMPLETED
    None = None
    Down = Down
    U = U

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ValidManifest
    ValidSequencers
    ValidApplyState
    ManifestRepresentsCommittedLog
    ConsistentMachineData
    NoDuplicateValues

CHECK_DEADLOCK FALSE
SYMMETRY Symmetry

\* For liveness, select LivenessSpec instead of Spec, remove SYMMETRY,
\* and enable the following properties. This does not promise append
\* availability after exhausting the model's loglet bounds.
\* PROPERTIES
\*     ReconfigurationCompletes
\*     PrefixTrimCompletes
