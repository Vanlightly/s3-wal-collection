CONSTANTS
    Replicas = {r1, r2}
    Values = {A, B, C}
    MaxEpoch = 3

    REFRESH = REFRESH
    ATTEMPT_LEADERSHIP = ATTEMPT_LEADERSHIP
    CATCHUP = CATCHUP
    JOIN = JOIN
    AWAIT_FOLLOW_RES = AWAIT_FOLLOW_RES
    READY = READY
    COMMIT_BATCH = COMMIT_BATCH
    APPEND_TO_LOG = APPEND_TO_LOG
    ILLEGAL_STATE = ILLEGAL_STATE

    OK = OK
    NOT_LEADER = NOT_LEADER
    FOLLOW_REQ = FOLLOW_REQ
    FOLLOW_RES = FOLLOW_RES
    SYNC_REQ = SYNC_REQ
    SYNC_RES = SYNC_RES
    None = None

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ValidLeaderState
    ReplicaStateIsCommittedPrefix
    LogMatchesCommittedHistory

CHECK_DEADLOCK FALSE
SYMMETRY Symmetry

\* For liveness checking, replace Spec above with LivenessSpec,
\* comment out SYMMETRY, and uncomment the properties below.
\* PROPERTIES
\*     AllReplicasJoin
\*     AllReplicasReachMaxEpoch
