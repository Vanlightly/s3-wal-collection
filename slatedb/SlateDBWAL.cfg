CONSTANTS
    \* Parameters
    Writers = {w1, w2, w3} 
    GarbageCollectors = {gc1}
    Values = {v1, v2}
    MaxWriterRestarts = 1
    EnableFix = TRUE
    \* NOTE: When EnableFix = FALSE, this spec needs either:
    \* - 4 writers with MaxWriterRestarts = 0
    \* - or 3 writers with MaxWriterRestarts = 1

    \* Model values
    REFRESH_LOAD = REFRESH_LOAD
    REFRESH_CHECK = REFRESH_CHECK
    REFRESH_DONE = REFRESH_DONE
    IDLE = IDLE
    INITIAL_MANIFEST_LOAD = INITIAL_MANIFEST_LOAD
    FIND_NEXT_WAL_ID = FIND_NEXT_WAL_ID
    CLAIM_EPOCH = CLAIM_EPOCH
    REFRESH_BEFORE_CLAIM = REFRESH_BEFORE_CLAIM
    CHECK_WAL_ID = CHECK_WAL_ID
    VALIDATE_AFTER_RECOMPUTE = VALIDATE_AFTER_RECOMPUTE
    CHECK_BOUNDARY = CHECK_BOUNDARY
    WRITE_FENCE = WRITE_FENCE
    VALIDATE_BEFORE_RETRY = VALIDATE_BEFORE_RETRY
    VALIDATE_BEFORE_REPLAY = VALIDATE_BEFORE_REPLAY
    VALIDATE_BEFORE_NOT_FOUND = VALIDATE_BEFORE_NOT_FOUND
    LOAD_SNAPSHOT = LOAD_SNAPSHOT
    REPLAY_WAL = REPLAY_WAL
    VALIDATE_AFTER_REPLAY = VALIDATE_AFTER_REPLAY
    READY = READY
    FENCED = FENCED
    NOT_FOUND = NOT_FOUND
    MANIFEST_GC = MANIFEST_GC
    WAL_GC = WAL_GC
    LOAD_BOUNDARY = LOAD_BOUNDARY
    COMPUTE_BOUNDARY = COMPUTE_BOUNDARY
    ADVANCE_BOUNDARY = ADVANCE_BOUNDARY
    DELETE = DELETE
    DONE = DONE
    DATA = DATA
    FENCE = FENCE
    NIL = NIL
    ILLEGAL_STATE = ILLEGAL_STATE

SPECIFICATION Spec

\* Uncomment when checking liveness
\* SPECIFICATION LivenessSpec

INVARIANTS
    TypeOK
    UniqueEpochs
    ValidGarbageCollectors
    ValidWriters
    ConsistentMachineData
    ManifestRepresentsCommittedLog

\* Uncomment when checking liveness
\* PROPERTIES 
\*     AllValuesAttempted
\*     WritersReachReadyOrFenced
\*     GcCompletes

CHECK_DEADLOCK FALSE
SYMMETRY Symmetry \* Comment out when checking liveness
