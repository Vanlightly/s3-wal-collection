CONSTANTS
    \* Parameters (IDs and Values must have the same cardinality)
    Replicas = {r1, r2, r3}
    GarbageCollectors = {gc1}
    Values = {A, B, C}
    IDs = {V, X, Y}

    \* Replica/GC states
    IDLE = IDLE
    READY = READY
    GET_WAL_INDEX = GET_WAL_INDEX
    APPEND_WAL_INDEX = APPEND_WAL_INDEX
    REFETCH = REFETCH
    REPLAY_WAL_INDEX = REPLAY_WAL_INDEX
    SERVE_READ = SERVE_READ
    ILLEGAL_STATE = ILLEGAL_STATE
    COMMIT_SNAPSHOT = COMMIT_SNAPSHOT
    NOT_FOUND = NOT_FOUND
    DELETE = DELETE

    \* Replica actions
    WRITE = WRITE
    READ = READ
    REPLICATE = REPLICATE

    NIL = NIL

SPECIFICATION Spec

\* For liveness, replace SPECIFICATION Spec with the following,
\* uncomment PROPERTIES below, and comment out SYMMETRY.
\* SPECIFICATION LivenessSpec

INVARIANTS
    TypeOK
    ValidReplicas
    ReadReposPrefixOfRecordedWriteHistory
    WalIndexRepresentsCommittedRepo

\* PROPERTIES
\*     AllValuesWritten
\*     ReplicaReachesReadyState

CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
