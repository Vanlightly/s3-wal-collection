\* A small but non-trivial exhaustive model: two writers each append once.
\* MaxLsn must leave room for every unique increment.

CONSTANTS
    Writers = {w1, w2}
    GarbageCollectors {gc1}
    Values = {A, B}

    SNAPSHOT_RECOVERY = SNAPSHOT_RECOVERY
    CATCHUP_RECOVERY = CATCHUP_RECOVERY
    VALIDATE = VALIDATE
    UPDATE_MANIFEST = UPDATE_MANIFEST
    READY = READY
    DELETE = DELETE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ConsistentLog

CHECK_DEADLOCK FALSE