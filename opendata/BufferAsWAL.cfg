CONSTANTS
    \* Parameters
    Writers = {w1, w2, w3}
    GarbageCollectors = {gc1}
    Values = {A, B, C, D}

    \* Model values
    IDLE = IDLE
    SNAPSHOT_RECOVERY = SNAPSHOT_RECOVERY
    CATCHUP_RECOVERY = CATCHUP_RECOVERY
    READY = READY
    CLAIM_MANIFEST = CLAIM_MANIFEST
    APPEND_TO_MANIFEST = APPEND_TO_MANIFEST
    COMMIT_SNAPSHOT = COMMIT_SNAPSHOT
    PREEMPTED = PREEMPTED
    DELETE = DELETE
    NIL = NIL

SPECIFICATION Spec

\* Uncomment when checking liveness, and comment out SPECIFICATION Spec.
\* Also comment out SYMMETRY below.
\* SPECIFICATION LivenessSpec

INVARIANTS
    TypeOK
    ValidWriters
    ConsistentMachineData
    ManifestRepresentsCommittedLog
    StoredSnapshotsAreValid
    SingleAuthoritativeWriter

\* Uncomment when checking liveness.
\* PROPERTIES
\*     AllValuesAttempted
\*     WritersReachReadyOrPreempted

CHECK_DEADLOCK FALSE

SYMMETRY Symmetry \* Comment out when checking liveness
