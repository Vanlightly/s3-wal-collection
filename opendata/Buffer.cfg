CONSTANTS
    \* Two writers exercise manifest append conflicts, while two readers
    \* exercise epoch and cursor fencing.
    Writers = {w1, w2}
    Readers = {r1, r2}
    Ids = {I, J, K}
    Values = {A, B, C}

    \* Model values
    IDLE = IDLE
    READ_MANIFEST = READ_MANIFEST
    APPEND_TO_MANIFEST = APPEND_TO_MANIFEST
    INCREMENT_EPOCH = INCREMENT_EPOCH
    READ_CURSOR = READ_CURSOR
    CLAIM_CURSOR = CLAIM_CURSOR
    READ_ENTRY = READ_ENTRY
    START_ACK = START_ACK
    PREFIX_TRIM = PREFIX_TRIM
    COMMIT = COMMIT
    PREEMPTED = PREEMPTED
    INVALID_STATE = INVALID_STATE
    NIL = NIL

SPECIFICATION Spec

\* Uncomment when checking liveness, and comment out SPECIFICATION Spec.
\* SPECIFICATION LivenessSpec

INVARIANTS
    TypeOK
    ValidReaders
    ReadValuesCompatibleWithWrittenValues

\* These are intentionally omitted because at-least-once delivery violates them:
\*     ReadValuesPrefixOfWrittenValues
\*     ReadValuesOrderingCompatibleWithWrittenValues

\* Uncomment when checking liveness.
\* PROPERTIES
\*     ReaderReachesTailOrPreempts

CHECK_DEADLOCK FALSE

SYMMETRY Symmetry \* Comment out when checking liveness
